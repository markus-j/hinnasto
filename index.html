<html lang="fi">
<head>
<meta charset="utf-8">
<title>Hinnasto — Taksi Markus Jaakola</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Hinnasto">
<link rel="manifest" href="manifest.json">
<style>
/* ------------------------------------------------------------------
   Taksin takaikkunan hinnastonäyttö.
   Suunnitteluperiaatteet:
   - Hinnat luettavissa 100 % ajasta: efektit liikkuvat vain hinnattomilla
     kaistoilla (otsikkopalkki + ekvalisaattoririvi), pysyvät reunoissa tai
     vaihtavat pelkkiä värejä niin, että kontrasti säilyy ennallaan.
   - Akunsäästö: animoidaan vain transform ja opacity (GPU),
     ei JS-ruutusilmukkaa, ei canvasia, ei animoitua blur/shadow-efektiä.
     Jatkuvia animaatioita on kourallinen; "yllätykset" ajetaan
     harvakseltaan ajastimella ja poistetaan DOMista jälkikäteen.
   - Musta tausta = vähemmän virtaa OLED-näytöllä.
------------------------------------------------------------------- */

:root{
  /* Väriparit. Nämä kaksi vaihtavat paikkaa "flip"-yllätyksessä,
     jolloin koko kyltti kääntyy negatiiviksi mutta kontrasti säilyy. */
  --dark:#000000;
  --bright:#FFF75E;

  --beat:0.667s;          /* 90 BPM — hiphopin perussyke */
  --frame:2.4vmin;        /* kyltin ympärille jäävä "näyttämö" efekteille */
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  height:100%;
  background:var(--dark);   /* kääntyy keltaiseksi flip-yllätyksessä */
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  font-weight:900;
  color:var(--bright);
}

body{
  display:flex;flex-direction:column;
  padding:calc(var(--frame) + env(safe-area-inset-top))
          calc(var(--frame) + env(safe-area-inset-right))
          calc(var(--frame) + env(safe-area-inset-bottom))
          calc(var(--frame) + env(safe-area-inset-left));
  gap:var(--frame);
}

/* ============ KYLTTI ============ */
.board{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;min-height:0}

.sign{
  position:relative;
  flex:1;display:flex;flex-direction:column;min-height:0;
  border-radius:1.6vmin;
  overflow:hidden;
  background:var(--dark);
  transform:translateZ(0);
  will-change:transform;
}

.band{display:flex;align-items:center;min-height:0;position:relative}
.band-dark{background:var(--dark);color:var(--bright)}
.band-bright{background:var(--bright);color:var(--dark)}

/* --- Otsikko --- */
.titlebar{flex:1.75;justify-content:center;overflow:hidden}
.titlebar h1{
  max-width:100%;                 /* jotta ylivuoto on mitattavissa (ks. fit()) */
  font-size:min(14.5vh,15vw);
  line-height:.98;
  letter-spacing:-.02em;
  white-space:nowrap;
  transform-origin:50% 60%;
  animation:beat calc(var(--beat)*4) ease-in-out infinite;
  will-change:transform;
}

/* Kiiltopyyhkäisy otsikon yli — pelkkä translate, hyvin kevyt. */
.shine{
  position:absolute;top:-20%;left:0;width:26%;height:140%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  mix-blend-mode:overlay;
  transform:translateX(-150%) skewX(-18deg);
  animation:shine 9s linear infinite;
  will-change:transform;
}

/* --- Esimerkkimatka --- */
.hero{flex:1.85;padding:0 3.5%;gap:2%}
.hero .label{flex:1;min-width:0}
.hero .label b{display:block;font-size:min(8.4vh,8.6vw);line-height:1;white-space:nowrap}
.hero .label span{display:block;font-size:min(4.1vh,4.2vw);line-height:1.5;white-space:nowrap}
.hero .sum{
  font-size:min(11.5vh,11.8vw);line-height:1;white-space:nowrap;
  transform-origin:50% 55%;
  animation:beat calc(var(--beat)*2) ease-in-out infinite;
  will-change:transform;
}

/* --- Hintarivit --- */
.rows{
  flex:4.7;
  display:grid;
  grid-template-columns:11% 51% 38%;
  grid-template-rows:repeat(3,1fr) 1.12fr;
  align-items:center;
  padding:0 3.5% 1.2% 2%;
  grid-template-areas:
    "pw  l1 v1"
    "pw  l2 v2"
    "i3  l3 v3"
    "i4  l4 l4";
}
.rows .lbl{font-size:min(7.4vh,7.6vw);line-height:1;white-space:nowrap}
.rows .val{font-size:min(7.4vh,7.6vw);line-height:1;white-space:nowrap}
.rows .wide{font-size:min(6.4vh,6.6vw);line-height:1;white-space:nowrap}
.a-pw{grid-area:pw}.a-i3{grid-area:i3}.a-i4{grid-area:i4}
.a-l1{grid-area:l1}.a-l2{grid-area:l2}.a-l3{grid-area:l3}.a-l4{grid-area:l4}
.a-v1{grid-area:v1}.a-v2{grid-area:v2}.a-v3{grid-area:v3}

.ico{width:min(8vh,8.2vw);height:min(8vh,8.2vw);display:block;color:var(--bright)}
.ico-emoji{font-size:min(6.6vh,6.8vw);line-height:1}

/* --- Alatunniste --- */
.legal{flex:1.5;flex-direction:column;justify-content:center;align-items:stretch;
       padding:0 3.5%;gap:.35em;font-weight:700}
.legal p{width:100%;font-size:min(3.2vh,3.3vw);line-height:1.15;white-space:nowrap}

/* --- Juokseva valoreunus (4 kevyttä transform-animaatiota) --- */
.chase{position:absolute;background:var(--bright);border-radius:99px;opacity:.9;
       box-shadow:0 0 1.4vmin var(--bright);will-change:transform;pointer-events:none;z-index:3}
.chase.t{top:0;left:0;height:.5vmin;width:22%;animation:runx 5s linear infinite}
.chase.b{bottom:0;right:0;height:.5vmin;width:22%;animation:runx 5s linear infinite reverse}
.chase.l{bottom:0;left:0;width:.5vmin;height:22%;animation:runy 5s linear infinite}
.chase.r{top:0;right:0;width:.5vmin;height:22%;animation:runy 5s linear infinite reverse}

/* ============ EKVALISAATTORI (kyltin alla, ei peitä mitään) ============ */
.eq{position:relative;z-index:2;height:7.5vh;min-height:34px;display:flex;align-items:flex-end;
    justify-content:center;gap:1.1vmin;padding:0 1vmin}
.eq i{
  display:block;flex:1;max-width:4.2vmin;height:100%;
  background:var(--bright);border-radius:.6vmin .6vmin 0 0;
  transform-origin:50% 100%;transform:scaleY(.18);
  animation:eq calc(var(--beat)*2) ease-in-out infinite alternate;
  will-change:transform;
}

/* ============ ETUKERROS ============
   Kaikki lentävät efektit kulkevat kahdella "kaistalla":
   otsikkopalkissa ja ekvalisaattorirovissa. Kummallakaan ei ole
   yhtään hintaa — hinnat eivät siis peity koskaan. */
.front{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}

.stamp{
  position:absolute;bottom:1.2vh;
  font-size:min(4.6vh,5vw);line-height:1;
  color:var(--dark);background:var(--bright);
  padding:.22em .5em;border-radius:.2em;
  white-space:nowrap;
  transform:scale(0) rotate(-7deg);
  animation:stamp 2.6s cubic-bezier(.2,1.6,.4,1) forwards;
  will-change:transform,opacity;
}
.stamp.left{left:3vw}
.stamp.right{right:3vw;transform:scale(0) rotate(6deg);animation-name:stampR}

/* Valonheitin pyyhkäisee koko kyltin yli — läpikuultava, teksti näkyy läpi. */
.sweep{
  position:absolute;top:-30%;left:0;width:34%;height:160%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);
  transform:translateX(-140%) skewX(-14deg);
  animation:sweep 1.5s ease-in-out forwards;
  will-change:transform;
}

/* Lentävät tarrat: koko ja korkeus asetetaan JS:stä kaistan mukaan. */
.sticker{position:absolute;line-height:1;will-change:transform;
         filter:drop-shadow(0 0 1vmin rgba(0,0,0,.5))}
/* Konfetti: pieniä lastuja, jotka eivät haittaa luettavuutta. */
.confetti{position:absolute;top:-6vh;width:1.2vmin;height:2.2vmin;border-radius:.3vmin;
          background:var(--bright);will-change:transform,opacity}
/* Bassoisku: reunat välähtävät. Ei ulotu tekstin päälle. */
.pulse{position:absolute;inset:0;border:2vmin solid var(--bright);border-radius:2vmin;
       opacity:0;will-change:opacity;animation:pulse calc(var(--beat)*3) ease-out forwards}

/* ============ ILMOITUS / OHJE ============ */
.toast{
  position:fixed;z-index:9;left:50%;bottom:2.5vh;transform:translateX(-50%);
  background:var(--bright);color:var(--dark);
  font-size:min(2.4vh,2.6vw);font-weight:900;letter-spacing:.04em;
  padding:.5em 1em;border-radius:99px;white-space:nowrap;
  opacity:0;transition:opacity .25s ease;pointer-events:none;
}
.toast.on{opacity:.96}

/* ============ ANIMAATIOT (vain transform / opacity) ============ */
@keyframes beat{
  0%,100%{transform:scale(1)}
  6%{transform:scale(1.055)}
  16%{transform:scale(.995)}
  26%{transform:scale(1)}
}
@keyframes shine{
  0%,72%{transform:translateX(-150%) skewX(-18deg)}
  92%,100%{transform:translateX(420%) skewX(-18deg)}
}
@keyframes runx{from{transform:translateX(-120%)}to{transform:translateX(560%)}}
@keyframes runy{from{transform:translateY(120%)}to{transform:translateY(-560%)}}
@keyframes eq{
  0%{transform:scaleY(.14)}
  100%{transform:scaleY(1)}
}
@keyframes stamp{
  0%{transform:scale(0) rotate(-30deg);opacity:0}
  18%{transform:scale(1.12) rotate(-7deg);opacity:1}
  28%{transform:scale(1) rotate(-7deg)}
  80%{transform:scale(1) rotate(-7deg);opacity:1}
  100%{transform:scale(.9) rotate(-7deg);opacity:0}
}
@keyframes stampR{
  0%{transform:scale(0) rotate(28deg);opacity:0}
  18%{transform:scale(1.12) rotate(6deg);opacity:1}
  28%{transform:scale(1) rotate(6deg)}
  80%{transform:scale(1) rotate(6deg);opacity:1}
  100%{transform:scale(.9) rotate(6deg);opacity:0}
}
@keyframes sweep{
  from{transform:translateX(-140%) skewX(-14deg)}
  to{transform:translateX(330%) skewX(-14deg)}
}
@keyframes pulse{
  0%{opacity:0}10%{opacity:.95}45%{opacity:.35}100%{opacity:0}
}
@keyframes flyR{
  from{transform:translate3d(-30vw,0,0) rotate(-25deg)}
  to{transform:translate3d(125vw,0,0) rotate(25deg)}
}
@keyframes flyL{
  from{transform:translate3d(125vw,0,0) rotate(25deg)}
  to{transform:translate3d(-30vw,0,0) rotate(-25deg)}
}
@keyframes drive{
  from{transform:translate3d(-25vw,0,0) scaleX(-1)}
  to{transform:translate3d(120vw,0,0) scaleX(-1)}
}
@keyframes fall{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:1}
  100%{transform:translate3d(4vw,112vh,0) rotate(540deg);opacity:.9}
}
/* Levysoittimen "scratch" — koko kyltti nytkähtää, teksti pysyy luettavana. */
@keyframes scratch{
  0%,100%{transform:translate3d(0,0,0) rotate(0)}
  12%{transform:translate3d(-1.4%,0,0) rotate(-.9deg)}
  30%{transform:translate3d(1.2%,0,0) rotate(.8deg)}
  50%{transform:translate3d(-.9%,0,0) rotate(-.5deg)}
  70%{transform:translate3d(.6%,0,0) rotate(.3deg)}
  86%{transform:translate3d(-.3%,0,0) rotate(-.1deg)}
}
@keyframes bump{
  0%,100%{transform:scale(1)}
  35%{transform:scale(1.035)}
}

.fx-scratch .sign{animation:scratch .75s cubic-bezier(.36,.07,.19,.97) both}
.fx-bump   .sign{animation:bump calc(var(--beat)*2) ease-in-out both}

/* Yllätys: värit kääntyvät ristiin. Kontrasti säilyy identtisenä. */
body.flip{--dark:#FFF75E;--bright:#000000}
/* Yllätys: neonväri mustalle pohjalle. */
body.neon{--bright:#22F0FF}
body.neon2{--bright:#FF4FD8}
body.neon3{--bright:#7CFF3D}

/* ============ TILAT ============ */
/* RAUHA: hitaampi syke, ekvalisaattori vaimeampi. */
body.chill{--beat:1.0s}
body.chill .shine{animation-duration:16s}
body.chill .chase{animation-duration:9s}

/* STILL: kaikki animaatiot pois — maksimi akunkesto. */
body.still *,body.still *::before,body.still *::after{
  animation:none!important;transition:none!important;
}
body.still .eq i{transform:scaleY(.5)}
body.still .front{display:none}

/* Taustavälilehti / näyttö pois: pysäytetään kaikki. */
body.sleep *,body.sleep *::before,body.sleep *::after{animation-play-state:paused!important}

@media (prefers-reduced-motion:reduce){
  .shine,.chase{animation:none}
}

/* Pystyasento: kavennetaan hieman, jotta pitkät rivit mahtuvat. */
@media (orientation:portrait){
  .rows{grid-template-columns:12% 50% 38%}
  .eq{height:6vh}
}
</style>
</head>
<body class="hype">

<div class="board">
  <div class="sign" id="sign">

          <path d="M27 26 a32 32 0 1 0 46 0" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
        </svg>

<!-- Ekvalisaattori kyltin alapuolella -->
<div class="eq" id="eq" aria-hidden="true"></div>

<!-- Etukerros: lentävät efektit vain hinnattomilla kaistoilla -->
<div class="front" id="front" aria-hidden="true"></div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var body    = document.body,
    front   = document.getElementById('front'),
    eq      = document.getElementById('eq'),
    toastEl = document.getElementById('toast');

/* ---------- Ekvalisaattoripalkit ---------- */
var BARS = 22;
for(var i=0;i<BARS;i++){
  var b=document.createElement('i');
  b.style.animationDelay   = (-(Math.random()*1.4).toFixed(2))+'s';
  b.style.animationDuration = 'calc(var(--beat) * '+(1+Math.round(Math.random()*2))+')';
  eq.appendChild(b);
}

/* ---------- Automaattinen sovitus ----------
   Kavennetaan tekstiä ryhmittäin, jos se ei mahdu riville. Näin hinnasto
   pysyy luettavana laitteesta, kirjasimesta ja asennosta riippumatta.
   Ajetaan vain kerran latauksessa ja asennon vaihtuessa — ei akkukuormaa. */
var FIT_GROUPS = [
  ['.titlebar h1'],
  ['.hero .label b','.hero .label span','.hero .sum'],
  ['.rows .lbl','.rows .val'],
  ['.rows .wide'],
  ['.legal p']
];

function fit(){
  FIT_GROUPS.forEach(function(sel){
    var els = [];
    sel.forEach(function(s){
      [].forEach.call(document.querySelectorAll(s), function(e){ els.push(e); });
    });
    els.forEach(function(e){ e.style.fontSize=''; });          // takaisin CSS-arvoon
    var k = 1;
    els.forEach(function(e){
      var have = e.clientWidth, need = e.scrollWidth;
      if(have > 0 && need > have) k = Math.min(k, have/need);
    });
    if(k < 1){
      k *= 0.985;                                             // pieni turvamarginaali
      els.forEach(function(e){
        var base = parseFloat(getComputedStyle(e).fontSize) || 16;
        e.style.fontSize = (base*k).toFixed(2)+'px';
      });
    }
  });
}

/* Kaistat, joilla lentävät efektit saavat liikkua: otsikkopalkki ja
   ekvalisaattoririvi. Molemmat ovat hinnattomia alueita. */
var LANES = [];
function lanes(){
  LANES = [];
  [['.titlebar',.78],['.eq',.94]].forEach(function(pair){
    var el = document.querySelector(pair[0]);
    if(!el) return;
    var r = el.getBoundingClientRect();
    if(r.height < 20) return;
    var size = r.height * pair[1];
    LANES.push({ top: r.top + (r.height - size)/2, size: size });
  });
}

var fitTimer;
function fitSoon(){ clearTimeout(fitTimer); fitTimer = setTimeout(function(){ fit(); lanes(); }, 150); }
window.addEventListener('resize', fitSoon);
window.addEventListener('orientationchange', fitSoon);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit).catch(function(){});

/* ---------- Tilat: HYPE / RAUHA / STILL ---------- */
var MODES = [
  {id:'hype',  name:'MENO: HYPE',  min: 7000, max:15000},
  {id:'chill', name:'MENO: RAUHA', min:25000, max:50000},
  {id:'still', name:'MENO: STILL — akku säästöllä', min:0, max:0}
];
var mode = 0;
try{
  var saved = localStorage.getItem('hinnasto-mode');
  if(saved!==null && MODES[saved|0]) mode = saved|0;
}catch(e){}

function applyMode(){
  MODES.forEach(function(m){ body.classList.remove(m.id); });
  body.classList.add(MODES[mode].id);
  try{ localStorage.setItem('hinnasto-mode', mode); }catch(e){}
  schedule();
}

function toast(txt,ms){
  toastEl.textContent = txt;
  toastEl.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ toastEl.classList.remove('on'); }, ms||2200);
}

/* ---------- Apurit ---------- */
function rnd(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function temp(el,parent,ms){                 // lisää elementti ja siivoa se pois
  parent.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, ms);
}
function flash(cls,ms){                      // väriluokka hetkeksi bodylle
  body.classList.add(cls);
  setTimeout(function(){ body.classList.remove(cls); }, ms);
}

var BEAT = 667;

/* ---------- Yllätykset ----------
   Jokainen efekti joko liikkuu kyltin takana (reunoilla näkyvissä),
   pysyy alareunan vapaassa tilassa tai vaihtaa vain värejä.
   Hinnat pysyvät aina täysin luettavina.                             */

var STICKERS = ['🔥','💸','🎧','🎤','👟','🕶️','👑','⚡','💥','🎉','🤙','🍕','💿','🚨'];
var WORDS = ['MENOKS!','KYYTIIN!','TAKSI!','VAPAA!','SKRRT!','BOOM!','TILAA NYT',
             'YÖ ON NUORI','KORTTI KÄY','HYPPÄÄ KYYTIIN','LEGIT','ISTU ALAS'];

var FX = {
  /* Iso emoji lentää kaistaa pitkin ruudun poikki */
  sticker:function(){
    if(!LANES.length) lanes();
    var n = 1 + (Math.random()*2|0), i;
    for(i=0;i<n;i++){
      var lane = pick(LANES);
      if(!lane) return;
      var s = document.createElement('div');
      s.className='sticker';
      s.textContent = pick(STICKERS);
      s.style.top = lane.top.toFixed(1)+'px';
      s.style.fontSize = lane.size.toFixed(1)+'px';
      var dur = rnd(2.6,4.2).toFixed(2);
      s.style.animation = pick(['flyR','flyL'])+' '+dur+'s linear '+(i*0.35).toFixed(2)+'s both';
      temp(s, front, (dur*1000|0) + 1200 + i*350);
    }
  },

  /* Konfettisade: pieniä lastuja, jotka eivät peitä numeroita */
  confetti:function(){
    for(var i=0;i<18;i++){
      var c=document.createElement('div');
      c.className='confetti';
      c.style.left = rnd(0,100).toFixed(1)+'vw';
      c.style.background = pick(['#FFF75E','#FFF75E','#22F0FF','#FF4FD8','#7CFF3D']);
      c.style.animation = 'fall '+rnd(2.2,3.4).toFixed(2)+'s linear '+rnd(0,.8).toFixed(2)+'s both';
      temp(c, front, 4600);
    }
    flash('fx-bump', BEAT*2+50);
  },

  /* Värit kääntyvät ristiin kahdeksi tahdiksi — kontrasti säilyy */
  flip:function(){
    body.classList.add('flip');
    setTimeout(function(){ body.classList.remove('flip'); }, BEAT*3);
  },

  /* Neonvälähdys tahdissa */
  neon:function(){
    var c = pick(['neon','neon2','neon3']);
    var n = 0;
    (function blink(){
      if(!live()){ body.classList.remove(c); return; }
      body.classList.toggle(c);
      if(++n < 6) setTimeout(blink, BEAT/2);
      else body.classList.remove(c);
    })();
  },

  /* Levysoittimen scratch: kyltti nytkähtää */
  scratch:function(){
    body.classList.add('fx-scratch');
    setTimeout(function(){ body.classList.remove('fx-scratch'); }, 800);
  },

  /* Taksi ajaa ekvalisaattorin poikki */
  taxi:function(){
    if(!LANES.length) lanes();
    var lane = LANES[LANES.length-1];
    if(!lane) return;
    var t=document.createElement('div');
    t.className='sticker';
    t.textContent='🚕';
    t.style.top = lane.top.toFixed(1)+'px';
    t.style.fontSize = lane.size.toFixed(1)+'px';
    t.style.animation='drive 4.2s linear both';
    temp(t, front, 4800);
  },

  /* Leima ponnahtaa alareunan vapaaseen tilaan */
  stamp:function(){
    var s=document.createElement('div');
    s.className='stamp '+pick(['left','right']);
    s.textContent = pick(WORDS);
    temp(s, front, 2900);
  },

  /* Valonheitin pyyhkäisee kyltin yli — läpikuultava, teksti näkyy läpi */
  sweep:function(){
    var s=document.createElement('div');
    s.className='sweep';
    temp(s, front, 1800);
  },

  /* Bassoisku: reunat välähtävät + kyltti pomppaa */
  boom:function(){
    var g=document.createElement('div');
    g.className='pulse';
    temp(g, front, BEAT*4);
    flash('fx-bump', BEAT*2+50);
  }
};

window.__fx = FX;   /* efektien esikatselu konsolista: __fx.confetti() */

/* Painotettu arvonta: kevyet efektit useammin, raskaammat harvemmin. */
var POOL = ['sticker','sticker','sticker','stamp','stamp','sweep','boom','boom',
            'flip','neon','scratch','taxi','confetti'];
var last = '';

/* Ajetaanko efektejä juuri nyt? (STILL-tilassa ja taustalla ei.) */
function live(){ return MODES[mode].min > 0 && !document.hidden; }

function runOne(){
  if(!live()) return;
  var name;
  do { name = pick(POOL); } while(name===last && POOL.length>1);
  last = name;
  try{ FX[name](); }catch(e){}

  /* Pieni todennäköisyys ketjuttaa toinen efekti perään = yllätyksellisyys */
  if(Math.random() < 0.28){
    setTimeout(function(){
      if(!live()) return;
      var n2; do { n2 = pick(POOL); } while(n2===name);
      try{ FX[n2](); }catch(e){}
    }, BEAT*4);
  }
}

/* ---------- Ajastin ---------- */
var timer = null;
function schedule(){
  clearTimeout(timer);
  var m = MODES[mode];
  if(!m.min) return;                       // STILL: ei yllätyksiä
  if(document.hidden) return;              // ei työtä taustalla
  timer = setTimeout(function(){
    runOne();
    schedule();
  }, rnd(m.min, m.max));
}

/* ---------- Näytön nukkuminen taustalla ---------- */
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    body.classList.add('sleep');
    clearTimeout(timer);
  }else{
    body.classList.remove('sleep');
    schedule();
    keepAwake();
  }
});

/* ---------- Pidetään näyttö hereillä (Safari 16.4+) ---------- */
var lock = null;
function keepAwake(){
  if(!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(l){
    lock = l;
    l.addEventListener('release', function(){ lock = null; });
  }).catch(function(){});
}

/* ---------- Napautus vaihtaa tilaa ---------- */
document.addEventListener('click', function(){
  keepAwake();
  mode = (mode + 1) % MODES.length;
  applyMode();
  toast(MODES[mode].name);
});

/* ---------- Käynnistys ---------- */
fit();
lanes();
applyMode();
setTimeout(function(){
  toast('Napauta ruutua: HYPE → RAUHA → STILL', 4500);
}, 900);

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
