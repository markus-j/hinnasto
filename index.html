<style>
/* ------------------------------------------------------------------
   Taksin takaikkunan hinnastonäyttö.
   Suunnitteluperiaatteet:
   - Hinnat luettavissa 100 % ajasta: isot emojit pysyvät oikeassa
     alanurkassa lasketulla alueella (zone()), leimat alakaistaleessa,
     ja väriefektit vaihtavat vain mustan ja keltaisen paikkaa.
   - Akunsäästö: animoidaan vain transform ja opacity (GPU),
     ei JS-ruutusilmukkaa, ei canvasia, ei animoitua blur/shadow-efektiä.
     Jatkuvasti pyöriviä animaatioita ei ole yhtään: kaikki liike on
     ajastettuja pätkiä, jotka poistetaan DOMista heti perään. Näin
     näyttö ehtii välillä levätä, mikä on akun kannalta ratkaisevaa.
   - Musta tausta = vähemmän virtaa OLED-näytöllä.
------------------------------------------------------------------- */

:root{
  /* Väriparit. Nämä kaksi vaihtavat paikkaa "flip"-yllätyksessä,
     jolloin koko kyltti kääntyy negatiiviksi mutta kontrasti säilyy. */
  --dark:#000000;
  --bright:#FFF75E;

  --beat:0.667s;          /* 90 BPM — hiphopin perussyke */
  --frame:2.4vmin;        /* kyltin ympärille jäävä "näyttämö" efekteille */
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  height:100%;
  background:var(--dark);   /* kääntyy keltaiseksi flip-yllätyksessä */
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  font-weight:900;
  color:var(--bright);
}

body{
  display:flex;flex-direction:column;
  padding:calc(var(--frame) + env(safe-area-inset-top))
          calc(var(--frame) + env(safe-area-inset-right))
          calc(var(--frame) + env(safe-area-inset-bottom))
          calc(var(--frame) + env(safe-area-inset-left));
  gap:var(--frame);
}

/* ============ KYLTTI ============ */
.board{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;min-height:0}

.sign{
  position:relative;
  flex:1;display:flex;flex-direction:column;min-height:0;
  border-radius:1.6vmin;
  overflow:hidden;
  background:var(--dark);
  transform:translateZ(0);
  will-change:transform;
}

.band{display:flex;align-items:center;min-height:0;position:relative}
.band-dark{background:var(--dark);color:var(--bright)}
.band-bright{background:var(--bright);color:var(--dark)}

/* --- Otsikko (STAATTINEN: ei omaa animaatiota) --- */
.titlebar{flex:1.75;justify-content:center;overflow:hidden}
.titlebar h1{
  max-width:100%;                 /* jotta ylivuoto on mitattavissa (ks. fit()) */
  font-size:min(14.5vh,15vw);
  line-height:.98;
  letter-spacing:-.02em;
  white-space:nowrap;
}

/* --- Esimerkkimatka (hinta STAATTINEN) --- */
.hero{flex:1.85;padding:0 3.5%;gap:2%}
.hero .label{flex:1;min-width:0}
.hero .label b{display:block;font-size:min(8.4vh,8.6vw);line-height:1;white-space:nowrap}
.hero .label span{display:block;font-size:min(4.1vh,4.2vw);line-height:1.5;white-space:nowrap}
.hero .sum{font-size:min(11.5vh,11.8vw);line-height:1;white-space:nowrap}

/* --- Hintarivit --- */
.rows{
  flex:4.7;
  display:grid;
  /* minmax(0,…): sarake ei saa venyä sisältönsä mukaan yli osuutensa,
     muuten mainossarake litistyy nollaan ahtaassa asennossa. */
  grid-template-columns:minmax(0,10%) minmax(0,42%) minmax(0,26%) minmax(0,22%);
  grid-template-rows:repeat(3,1fr) 1.12fr;
  align-items:center;
  padding:0 3.5% 1.2% 2%;
  grid-template-areas:
    "pw  l1 v1 bn"
    "pw  l2 v2 bn"
    "i3  l3 v3 bn"
    "i4  l4 l4 l4";
}
/* min-width:0 — muuten ruudukon sarake venyy sisällön mukaan yli
   prosenttileveytensä, jolloin fit() ei näe ylivuotoa lainkaan. */
.rows > *{min-width:0}
.rows .lbl{font-size:min(7.4vh,7.6vw);line-height:1;white-space:nowrap;padding-right:.4em}
.rows .val{font-size:min(7.4vh,7.6vw);line-height:1;white-space:nowrap}
.rows .wide{font-size:min(6.4vh,6.6vw);line-height:1;white-space:nowrap}
.a-pw{grid-area:pw}.a-i3{grid-area:i3}.a-i4{grid-area:i4}
.a-l1{grid-area:l1}.a-l2{grid-area:l2}.a-l3{grid-area:l3}.a-l4{grid-area:l4}
.a-v1{grid-area:v1}.a-v2{grid-area:v2}.a-v3{grid-area:v3}

.ico{width:min(8vh,8.2vw);height:min(8vh,8.2vw);display:block;color:var(--bright)}

/* --- Mainoslakana hintarivien oikealla puolella ---
   Yksi lakana kerrallaan: näkyy hetken, katoaa hetkeksi kokonaan,
   ja tilalle tulee seuraava teksti. */
.banners{
  grid-area:bn;align-self:stretch;
  display:flex;align-items:center;justify-content:center;
  padding:6% 0 6% 4%;min-height:0;
}
.banner{
  --rot:-2.5deg;
  width:100%;height:66%;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:.25em .45em;border-radius:1vmin;
  font-size:min(4.6vh,4.8vw);line-height:1.04;letter-spacing:-.01em;
  overflow:hidden;
  transform:rotate(var(--rot));
  transition:opacity .35s ease, transform .35s ease;
  will-change:opacity,transform;
}
/* Kaksi ilmettä, molemmat mustaa ja keltaista. */
.banner.solid{background:var(--bright);color:var(--dark)}
.banner.hollow{--rot:2deg;background:var(--dark);color:var(--bright);
               box-shadow:inset 0 0 0 .55vmin var(--bright)}
.banner.out{opacity:0;transform:rotate(var(--rot)) scale(.82)}

/* --- Alatunniste --- */
.legal{flex:1.5;flex-direction:column;justify-content:center;align-items:stretch;
       padding:0 3.5%;gap:.35em;font-weight:700}
.legal p{width:100%;font-size:min(3.2vh,3.3vw);line-height:1.15;white-space:nowrap}

/* ============ ALAPALKKI ============
   Ekvalisaattori on poistettu kokonaan: se oli ainoa jatkuvasti pyörivä
   animaatio (22 palkkia 60 fps), eli koko näytön lepotilan este.
   Tyhjä musta kaistale jää tilalle, koska leimat ja nurkkaemojit
   käyttävät sitä — ilman sitä ne osuisivat alatunnisteen tekstiin. */
.floor{height:6vh;min-height:26px;flex:none}

/* ============ ETUKERROS ============ */
.front{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}

.stamp{
  position:absolute;bottom:1.2vh;
  font-size:min(4.6vh,5vw);line-height:1;
  color:var(--dark);background:var(--bright);
  padding:.22em .5em;border-radius:.2em;
  white-space:nowrap;
  transform:scale(0) rotate(-7deg);
  animation:stamp 2.6s cubic-bezier(.2,1.6,.4,1) forwards;
  will-change:transform,opacity;
}
.stamp.left{left:3vw}
.stamp.right{right:3vw;transform:scale(0) rotate(6deg);animation-name:stampR}

/* --- Nurkkaemojit ---
   Isoja emojeja oikeassa alanurkassa: nousevat alhaalta, viipyvät
   paikallaan ja poistuvat oikealle tai alas. Laatikon paikka lasketaan
   ajossa (zone()) niin, ettei se osu yhteenkään tekstiin tai hintaan. */
.corner{position:absolute;display:flex;align-items:flex-end;justify-content:center;
        pointer-events:none;overflow:visible}
.corner span{
  display:block;line-height:1;
  filter:drop-shadow(0 .4vmin 1.4vmin rgba(0,0,0,.6));
  will-change:transform,opacity;
}

/* Konfetti: pieniä lastuja, jotka eivät haittaa luettavuutta. */
.confetti{position:absolute;top:-6vh;width:1.2vmin;height:2.2vmin;border-radius:.3vmin;
          will-change:transform,opacity}
/* Bassoisku: reunat välähtävät. Ei ulotu tekstin päälle. */
.pulse{position:absolute;inset:0;border:2vmin solid var(--bright);border-radius:2vmin;
       opacity:0;will-change:opacity;animation:pulse calc(var(--beat)*3) ease-out forwards}

/* ============ ILMOITUS / OHJE ============ */
.toast{
  position:fixed;z-index:9;left:50%;bottom:2.5vh;transform:translateX(-50%);
  background:var(--bright);color:var(--dark);
  font-size:min(2.4vh,2.6vw);font-weight:900;letter-spacing:.04em;
  padding:.5em 1em;border-radius:99px;white-space:nowrap;
  opacity:0;transition:opacity .25s ease;pointer-events:none;
}
.toast.on{opacity:.96}

/* ============ ANIMAATIOT (vain transform / opacity) ============ */
@keyframes stamp{
  0%{transform:scale(0) rotate(-30deg);opacity:0}
  18%{transform:scale(1.12) rotate(-7deg);opacity:1}
  28%{transform:scale(1) rotate(-7deg)}
  80%{transform:scale(1) rotate(-7deg);opacity:1}
  100%{transform:scale(.9) rotate(-7deg);opacity:0}
}
@keyframes stampR{
  0%{transform:scale(0) rotate(28deg);opacity:0}
  18%{transform:scale(1.12) rotate(6deg);opacity:1}
  28%{transform:scale(1) rotate(6deg)}
  80%{transform:scale(1) rotate(6deg);opacity:1}
  100%{transform:scale(.9) rotate(6deg);opacity:0}
}
@keyframes pulse{
  0%{opacity:0}10%{opacity:.95}45%{opacity:.35}100%{opacity:0}
}
/* Nouse alhaalta -> viivy -> poistu oikealle. Keskiosa on liikkumaton,
   joten emoji seisoo paikallaan luettavan pitkään. */
@keyframes cornerRight{
  0%  {transform:translate3d(0,135%,0) rotate(-8deg);opacity:0}
  9%  {opacity:1}
  22% {transform:translate3d(0,0,0) rotate(0deg)}
  68% {transform:translate3d(0,0,0) rotate(0deg)}
  100%{transform:translate3d(210%,0,0) rotate(14deg);opacity:1}
}
/* Sama, mutta poistuu alas. */
@keyframes cornerDown{
  0%  {transform:translate3d(0,135%,0) rotate(7deg);opacity:0}
  9%  {opacity:1}
  22% {transform:translate3d(0,0,0) rotate(0deg)}
  68% {transform:translate3d(0,0,0) rotate(0deg)}
  100%{transform:translate3d(0,145%,0) rotate(-10deg);opacity:1}
}
@keyframes fall{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:1}
  100%{transform:translate3d(4vw,112vh,0) rotate(540deg);opacity:.9}
}
/* Levysoittimen "scratch" — koko kyltti nytkähtää, teksti pysyy luettavana. */
@keyframes scratch{
  0%,100%{transform:translate3d(0,0,0) rotate(0)}
  12%{transform:translate3d(-1.4%,0,0) rotate(-.9deg)}
  30%{transform:translate3d(1.2%,0,0) rotate(.8deg)}
  50%{transform:translate3d(-.9%,0,0) rotate(-.5deg)}
  70%{transform:translate3d(.6%,0,0) rotate(.3deg)}
  86%{transform:translate3d(-.3%,0,0) rotate(-.1deg)}
}
@keyframes bump{
  0%,100%{transform:scale(1)}
  35%{transform:scale(1.035)}
}

.fx-scratch .sign{animation:scratch .75s cubic-bezier(.36,.07,.19,.97) both}
.fx-bump   .sign{animation:bump calc(var(--beat)*2) ease-in-out both}

/* Yllätys: värit kääntyvät ristiin. Kontrasti säilyy identtisenä. */
body.flip{--dark:#FFF75E;--bright:#000000}

/* ============ TILAT ============ */
/* RAUHA: hitaampi syke, ekvalisaattori vaimeampi. */
body.chill{--beat:1.0s}

/* STILL: kaikki animaatiot pois — maksimi akunkesto. */
body.still *,body.still *::before,body.still *::after{
  animation:none!important;transition:none!important;
}
body.still .front{display:none}

/* Taustavälilehti / näyttö pois: pysäytetään kaikki. */
body.sleep *,body.sleep *::before,body.sleep *::after{animation-play-state:paused!important}

/* Pystyasento: kavennetaan hieman, jotta pitkät rivit mahtuvat. */
@media (orientation:portrait){
  /* Sama neljä saraketta, kapeampi mainossarake. fit() kutistaa
     hintatekstit sen verran, että kaikki mahtuu. */
  .rows{grid-template-columns:minmax(0,11%) minmax(0,43%) minmax(0,26%) minmax(0,20%)}
  .floor{height:5vh}
}
</style>

<script>
(function(){
"use strict";

var body    = document.body,
    front   = document.getElementById('front'),
    toastEl = document.getElementById('toast');

/* ---------- Automaattinen sovitus ----------
   Kavennetaan tekstiä ryhmittäin, jos se ei mahdu riville. Näin hinnasto
   pysyy luettavana laitteesta, kirjasimesta ja asennosta riippumatta.
   Ajetaan vain kerran latauksessa ja asennon vaihtuessa — ei akkukuormaa. */
var FIT_GROUPS = [
  ['.titlebar h1'],
  ['.hero .label b','.hero .label span','.hero .sum'],
  ['.rows .lbl','.rows .val'],
  ['.rows .wide'],
  ['.legal p']
];

function fit(){
  FIT_GROUPS.forEach(function(sel){
    var els = [];
    sel.forEach(function(s){
      [].forEach.call(document.querySelectorAll(s), function(e){ els.push(e); });
    });
    els.forEach(function(e){ e.style.fontSize=''; });          // takaisin CSS-arvoon
    var k = 1;
    els.forEach(function(e){
      var have = e.clientWidth, need = e.scrollWidth;
      if(have > 0 && need > have) k = Math.min(k, have/need);
    });
    if(k < 1){
      k *= 0.985;                                             // pieni turvamarginaali
      els.forEach(function(e){
        var base = parseFloat(getComputedStyle(e).fontSize) || 16;
        e.style.fontSize = (base*k).toFixed(2)+'px';
      });
    }
  });
}

var fitTimer;
function fitSoon(){
  clearTimeout(fitTimer);
  fitTimer = setTimeout(function(){ fit(); zone(); fitBanner(bannerEl); }, 150);
}
window.addEventListener('resize', fitSoon);
window.addEventListener('orientationchange', fitSoon);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit).catch(function(){});

/* ---------- Tilat: HYPE / RAUHA / STILL ---------- */
var MODES = [
  {id:'hype',  name:'MENO: HYPE',  min: 7000, max:15000},
  {id:'chill', name:'MENO: RAUHA', min:25000, max:50000},
  {id:'still', name:'MENO: STILL — akku säästöllä', min:0, max:0}
];
var mode = 0;
try{
  var saved = localStorage.getItem('hinnasto-mode');
  if(saved!==null && MODES[saved|0]) mode = saved|0;
}catch(e){}

function applyMode(){
  MODES.forEach(function(m){ body.classList.remove(m.id); });
  body.classList.add(MODES[mode].id);
  try{ localStorage.setItem('hinnasto-mode', mode); }catch(e){}
  schedule();
  bannerCycle();
  cornerLoop();
}

function toast(txt,ms){
  toastEl.textContent = txt;
  toastEl.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ toastEl.classList.remove('on'); }, ms||2200);
}

/* ---------- Apurit ---------- */
function rnd(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function temp(el,parent,ms){                 // lisää elementti ja siivoa se pois
  parent.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, ms);
}
function flash(cls,ms){                      // väriluokka hetkeksi bodylle
  body.classList.add(cls);
  setTimeout(function(){ body.classList.remove(cls); }, ms);
}

var BEAT = 667;

/* ---------- Yllätykset ----------
   Jokainen efekti liikkuu hinnattomalla kaistalla, pysyy alareunan
   vapaassa tilassa tai vaihtaa pelkkiä värejä. Hinnat pysyvät aina
   luettavina, eikä ruudulla ole muita värejä kuin musta ja keltainen:
   kaikki kuviot ovat yksivärisiä siluetteja, ei emojeja.            */

var EMOJI = ['🔥','💸','🎧','🎤','👟','🕶️','👑','⚡','💥','🎉','🤙','🍕','💿','🚨','🤩','🏆',
             '⭐','🎵','📻','💶','🚕','🕺','💃','🪩','🎫','🥤','🍔','😎','🙌','💯'];

var WORDS = ['MENOKS!','KYYTIIN!','TAKSI!','VAPAA!','SKRRT!','BOOM!','TILAA NYT',
             'YÖ ON NUORI','KORTTI KÄY','HYPPÄÄ KYYTIIN','LEGIT','ISTU ALAS'];



var FX = {
  /* Konfettisade: pieniä lastuja, jotka eivät peitä numeroita */
  confetti:function(){
    for(var i=0;i<18;i++){
      var c=document.createElement('div');
      c.className='confetti';
      c.style.left = rnd(0,100).toFixed(1)+'vw';
      c.style.background = pick(['#FFF75E','#FF4FD8','#22F0FF','#7CFF3D','#FF7A29','#FFFFFF']);
      c.style.animation = 'fall '+rnd(2.2,3.4).toFixed(2)+'s linear '+rnd(0,.8).toFixed(2)+'s both';
      temp(c, front, 4600);
    }
    flash('fx-bump', BEAT*2+50);
  },

  /* Värit kääntyvät ristiin kahdeksi tahdiksi — kontrasti säilyy */
  flip:function(){
    body.classList.add('flip');
    setTimeout(function(){ body.classList.remove('flip'); }, BEAT*3);
  },

  /* Strobo: väriparin nopea vaihto tahdissa (musta/keltainen ristiin) */
  strobe:function(){
    var n = 0;
    (function blink(){
      if(!live()){ body.classList.remove('flip'); return; }
      body.classList.toggle('flip');
      if(++n < 6) setTimeout(blink, BEAT/2);
      else body.classList.remove('flip');
    })();
  },

  /* Levysoittimen scratch: kyltti nytkähtää */
  scratch:function(){
    body.classList.add('fx-scratch');
    setTimeout(function(){ body.classList.remove('fx-scratch'); }, 800);
  },

  /* Leima ponnahtaa alareunan vapaaseen tilaan */
  stamp:function(){
    var s=document.createElement('div');
    s.className='stamp '+pick(['left','right']);
    s.textContent = pick(WORDS);
    temp(s, front, 2900);
  },

  /* Bassoisku: reunat välähtävät + kyltti pomppaa */
  boom:function(){
    var g=document.createElement('div');
    g.className='pulse';
    temp(g, front, BEAT*4);
    flash('fx-bump', BEAT*2+50);
  }
};

window.__fx = FX;
window.__corner = cornerShow;   /* nurkkaemojin esikatselu konsolista */
window.__zone = function(){ return ZONE; };   /* efektien esikatselu konsolista: __fx.confetti() */

/* Painotettu arvonta: kevyet efektit useammin, raskaammat harvemmin. */
var POOL = ['stamp','stamp','boom','boom','flip','flip',
            'strobe','scratch','confetti'];
var last = '';

/* ---------- Nurkkaemojit ----------
   Alue lasketaan oikeista elementeistä: yläreuna on hintarivien
   alapuolella ja vasen reuna alatunnisteen pisimmän tekstin oikealla
   puolella. Niinpä emojit eivät voi peittää hintoja eivätkä tekstejä,
   vaikka ne saavat mennä ekvalisaattorin ja leimojen päälle.        */
var COMBOS = [
  ['🍕','🥤'], ['🍔','🍟'], ['🎧','🔥'], ['👑','💸'], ['🕺','🪩'],
  ['😎','💯'], ['🎤','🎶'], ['🤩','🎉'], ['🥳','🎂'], ['⚡','🏆'],
  ['🎫','🙌'], ['🚕','💨'], ['💃','🕶️'], ['🍦','☀️'], ['🐐','🔥']
];
var ZONE = null, cornerTimer = null;

/* Tekstin todellinen oikea reuna. Alatunnisteen rivit ovat koko palkin
   levyisiä elementtejä, joten pelkkä elementin reuna kertoisi väärin —
   Range mittaa itse merkkijonon. */
function textRight(el){
  var rng = document.createRange();
  rng.selectNodeContents(el);
  var r = rng.getBoundingClientRect();
  return r.width ? r.right : el.getBoundingClientRect().left;
}

function zone(){
  var rows  = document.querySelector('.rows').getBoundingClientRect();
  var right = 0;
  [].forEach.call(document.querySelectorAll('.legal p'), function(p){
    right = Math.max(right, textRight(p));
  });
  var left = Math.max(right + innerWidth*0.02, innerWidth*0.58);
  var z = { left:left, top:rows.bottom, w:innerWidth-left, h:innerHeight-rows.bottom };

  /* Pystyasennossa alatunnisteen rivit vievät lähes koko leveyden, jolloin
     ylläolevasta ei jää käyttökelpoista aluetta. Silloin siirrytään kyltin
     alapuolelle ekvalisaattorin päälle — sen päälle saa mennä. */
  if(z.w < innerWidth*0.16){
    var sign = document.querySelector('.sign').getBoundingClientRect();
    z = { left:innerWidth*0.5, top:sign.bottom,
          w:innerWidth*0.5, h:innerHeight-sign.bottom };
  }
  ZONE = z;
}

/* Yksi emojiyhdistelmä nurkkaan. */
function cornerShow(){
  if(!live()) return;
  if(!ZONE) zone();
  if(ZONE.w < 60 || ZONE.h < 60) return;

  var combo = pick(COMBOS);
  var gap   = ZONE.w * 0.05;
  var pad   = ZONE.h * 0.08;      /* emoji ei jää kiinni ruudun alareunaan */
  var size  = Math.min((ZONE.h - pad) * 0.94,
                       (ZONE.w - gap*(combo.length-1)) / combo.length * 0.94);
  var dur   = 12;

  var box = document.createElement('div');
  box.className = 'corner';
  box.style.left   = ZONE.left.toFixed(1)+'px';
  box.style.top    = ZONE.top.toFixed(1)+'px';
  box.style.width  = ZONE.w.toFixed(1)+'px';
  box.style.height = ZONE.h.toFixed(1)+'px';
  box.style.gap    = gap.toFixed(1)+'px';
  box.style.paddingBottom = pad.toFixed(1)+'px';

  var spans = combo.map(function(chr){
    var s = document.createElement('span');
    s.textContent = chr;
    s.style.fontSize = size.toFixed(1)+'px';
    box.appendChild(s);
    return s;
  });
  front.appendChild(box);

  /* Emojin piirtoala on isompi kuin sen fonttikoko (eri fonteissa eri
     verran), joten mitataan todellinen koko ja kutistetaan tarvittaessa.
     Näin ryhmä pysyy alueellaan eikä yllä tekstien päälle. */
  var wide = 0, tall = 0;
  spans.forEach(function(s){
    var r = s.getBoundingClientRect();
    wide += r.width; tall = Math.max(tall, r.height);
  });
  wide += gap * (spans.length - 1);
  var k = Math.min(1, (ZONE.w*0.98)/wide, (ZONE.h - pad)/tall);
  if(k < 1) spans.forEach(function(s){ s.style.fontSize = (size*k).toFixed(1)+'px'; });

  spans.forEach(function(s,i){
    s.style.animation = pick(['cornerRight','cornerDown'])+' '+dur+'s '+
                        'cubic-bezier(.33,0,.2,1) '+(i*0.8).toFixed(2)+'s both';
  });
  temp(box, front, dur*1000 + combo.length*800 + 600);
}

function cornerLoop(){
  clearTimeout(cornerTimer);
  if(!live()) return;
  var slow = MODES[mode].id === 'chill';
  cornerTimer = setTimeout(function(){
    cornerShow();
    cornerLoop();
  }, slow ? rnd(30000,45000) : rnd(15000,21000));
}

/* Ajetaanko efektejä juuri nyt? (STILL-tilassa ja taustalla ei.) */
function live(){ return MODES[mode].min > 0 && !document.hidden; }

/* ---------- Mainoslakana ----------
   Yksi lakana kerrallaan: teksti näkyy hetken, katoaa kokonaan
   hetkeksi, ja sitten tulee näkyviin seuraava teksti.            */
var BANNERS = ['BLOCKFEST 2026','GO TAMPERE','BLOCKFEST TAMPERE',
               'BLOCKFEST = LEGIT','MÄKKÄRIN KAUTTA KÄMPILLE'];
var bannerEl = document.getElementById('banner');
var bannerIdx = -1, bannerTimer = null, bannerTimer2 = null;

/* Pienennetään tekstiä kunnes se mahtuu lakanaan (rivitys sallittu). */
function fitBanner(el){
  el.style.fontSize='';
  var size = parseFloat(getComputedStyle(el).fontSize) || 16, guard = 0;
  while(guard++ < 14 &&
        (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)){
    size *= 0.92;
    el.style.fontSize = size.toFixed(2)+'px';
  }
}

/* Seuraava teksti näkyviin. Ilme vaihtuu vuorotellen. */
function nextBanner(){
  bannerIdx = (bannerIdx + 1) % BANNERS.length;
  bannerEl.textContent = BANNERS[bannerIdx];
  bannerEl.classList.toggle('solid',  bannerIdx % 2 === 0);
  bannerEl.classList.toggle('hollow', bannerIdx % 2 === 1);
  fitBanner(bannerEl);
  bannerEl.classList.remove('out');
}

function stopBanner(){ clearTimeout(bannerTimer); clearTimeout(bannerTimer2); }

/* Näkyvissä ON ms, piilossa OFF ms, sitten seuraava teksti. */
function bannerCycle(){
  stopBanner();
  if(!live()){ bannerEl.classList.remove('out'); return; }   // STILL: jää näkyviin
  var slow = MODES[mode].id === 'chill';
  bannerTimer = setTimeout(function(){
    bannerEl.classList.add('out');                            // piiloon
    bannerTimer2 = setTimeout(function(){
      if(!live()){ bannerEl.classList.remove('out'); return; }
      nextBanner();
      bannerCycle();
    }, slow ? 5000 : 2600);
  }, slow ? 12000 : 6000);
}

function initBanners(){ nextBanner(); }

function runOne(){
  if(!live()) return;
  var name;
  do { name = pick(POOL); } while(name===last && POOL.length>1);
  last = name;
  try{ FX[name](); }catch(e){}

  /* Pieni todennäköisyys ketjuttaa toinen efekti perään = yllätyksellisyys */
  if(Math.random() < 0.28){
    setTimeout(function(){
      if(!live()) return;
      var n2; do { n2 = pick(POOL); } while(n2===name);
      try{ FX[n2](); }catch(e){}
    }, BEAT*4);
  }
}

/* ---------- Ajastin ---------- */
var timer = null;
function schedule(){
  clearTimeout(timer);
  var m = MODES[mode];
  if(!m.min) return;                       // STILL: ei yllätyksiä
  if(document.hidden) return;              // ei työtä taustalla
  timer = setTimeout(function(){
    runOne();
    schedule();
  }, rnd(m.min, m.max));
}

/* ---------- Näytön nukkuminen taustalla ---------- */
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    body.classList.add('sleep');
    clearTimeout(timer);
    clearTimeout(cornerTimer);
    stopBanner();
  }else{
    body.classList.remove('sleep');
    schedule();
    bannerCycle();
    cornerLoop();
    keepAwake();
  }
});

/* ---------- Pidetään näyttö hereillä (Safari 16.4+) ---------- */
var lock = null;
function keepAwake(){
  if(!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(l){
    lock = l;
    l.addEventListener('release', function(){ lock = null; });
  }).catch(function(){});
}

/* ---------- Napautus vaihtaa tilaa ---------- */
document.addEventListener('click', function(){
  keepAwake();
  mode = (mode + 1) % MODES.length;
  applyMode();
  toast(MODES[mode].name);
});

/* ---------- Käynnistys ---------- */
fit();
zone();
initBanners();
applyMode();
setTimeout(function(){
  toast('Napauta ruutua: HYPE → RAUHA → STILL', 4500);
}, 900);
setTimeout(cornerShow, 3500);

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
</body>
